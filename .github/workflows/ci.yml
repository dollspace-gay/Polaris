name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Forces clippy to fail on any warning. Combined with the workspace lints
  # baseline (`[workspace.lints]` in Cargo.toml), this is the green-build
  # contract for the whole tree.
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: cargo clippy --workspace --all-targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (native)
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          SQLX_OFFLINE: "true"

  test:
    # Runs every workspace test, including the threat-model suite at
    # `polaris-backend/tests/threat_t{1..6}_*.rs` (issue #39). The
    # six tests cover design.md §9's primary threats T1-T6:
    #
    #   T1 — compromised moderator              (threat_t1_compromised_moderator.rs)
    #   T2 — audit-log tampering                 (threat_t2_audit_tamper.rs)
    #   T3 — weaponized reports                  (threat_t3_weaponized_reports.rs)
    #   T4 — DoS report flood                    (threat_t4_dos_report_flood.rs)
    #   T5 — malicious payload render            (threat_t5_malicious_payload_render.rs)
    #   T6 — moderator-identity leak via labels  (threat_t6_moderator_identity_leak.rs)
    #
    # The threats suite is wired into `cargo test --workspace` by
    # Cargo's standard `tests/*.rs` integration-test discovery — no
    # separate job is needed. Each test owns its own Postgres 16
    # testcontainer per the architect's pre-flight (hermetic per
    # test). #[ignore]'d sub-tests document follow-up issues #73-#76.
    #
    # To run only the threat suite locally:
    #   cargo test -p polaris-backend --test 'threat_*'
    name: cargo test --workspace
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # REQ-E4 / AC-E4: run the producer-slice smoke test explicitly
      # BEFORE the workspace-wide `cargo test` so a deliberately-
      # broken commit fails CI loudly with a step name that points
      # straight at the smoke. The same test reruns inside the
      # `cargo test --workspace` step below because integration
      # tests under `polaris-backend/tests/*.rs` are picked up
      # automatically — the explicit step is the named handle the
      # CI failure output reaches for.
      - name: smoke_e2e (producer slice; REQ-E1 / AC-E1)
        run: cargo test -p polaris-backend --test smoke_e2e -- --nocapture
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          SQLX_OFFLINE: "true"
      - name: test (native, postgres service — includes threat suite)
        run: cargo test --workspace
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          SQLX_OFFLINE: "true"

  wasm-build:
    # AC-12: this is the first wasm-build verifier on the proto-blue dep
    # chain. Failures that root-cause to proto-blue are surfaced upstream
    # by filing an issue against dollspace-gay/proto-blue with a
    # reproduction; failures local to polaris-frontend are fixed here.
    #
    # AC-16 (issue #34) extends this job with a release build + the
    # `check-wasm-symbols` xtask. The xtask reads the release artifact
    # and asserts the `proto-blue-lexicon` validation engine survived
    # dead-code elimination; without that, the inline client-side
    # validation contract silently degrades to a server-side fallback.
    name: cargo build --target wasm32-unknown-unknown -p polaris-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: build (wasm32-unknown-unknown)
        run: cargo build --target wasm32-unknown-unknown -p polaris-frontend
        env:
          SQLX_OFFLINE: "true"
      - name: clippy (wasm32-unknown-unknown)
        run: cargo clippy --target wasm32-unknown-unknown -p polaris-frontend --lib -- -D warnings
        env:
          SQLX_OFFLINE: "true"
      - name: build release wasm (AC-16)
        run: cargo build --release --target wasm32-unknown-unknown -p polaris-frontend
        env:
          SQLX_OFFLINE: "true"
      - name: check-wasm-symbols (AC-16)
        run: cargo xtask check-wasm-symbols
        env:
          SQLX_OFFLINE: "true"
      - name: check-wasm-budget (#71)
        # Raw-bytes ceiling on the release wasm artifact. Default 2 MiB.
        # Operators may relax via POLARIS_WASM_BUDGET_BYTES if the bundle
        # justifies it; the failure mode is loud (CI fails the PR with the
        # actual size and the budget side-by-side).
        run: cargo xtask check-wasm-budget
        env:
          SQLX_OFFLINE: "true"

  lexicon-codegen-sync:
    # REQ-3 / AC-2: the generated tree in polaris-lexicons/src/generated/
    # must always match a fresh `cargo xtask gen-lexicons` run. Any
    # hand-edit or missed regeneration causes `git diff --exit-code` to
    # fail this job and block the PR.
    name: lexicon codegen is in sync (REQ-3 / AC-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: lexicon codegen is in sync (REQ-3 / AC-2)
        run: |
          cargo xtask gen-lexicons
          git diff --exit-code polaris-lexicons/src/generated
        env:
          SQLX_OFFLINE: "true"

  lexicon-wasm-build:
    # AC-4: polaris-lexicons must build for wasm32-unknown-unknown —
    # no tokio / reqwest / platform-native deps are permitted.
    name: cargo build --target wasm32-unknown-unknown -p polaris-lexicons (AC-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: build (wasm32-unknown-unknown)
        run: cargo build --target wasm32-unknown-unknown -p polaris-lexicons
        env:
          SQLX_OFFLINE: "true"
      - name: clippy (wasm32-unknown-unknown)
        run: cargo clippy --target wasm32-unknown-unknown -p polaris-lexicons --lib -- -D warnings
        env:
          SQLX_OFFLINE: "true"

  polaris-types-wasm-build:
    # #104 / M5 #42 PR 4: polaris-types must build for wasm32-unknown-unknown
    # because the frontend depends on it transitively. The lexicon_mapping
    # module added in #103 pulls polaris-lexicons + proto-blue-syntax;
    # this job catches any future regression where a non-wasm dep leaks in
    # through the mapping layer.
    name: cargo build --target wasm32-unknown-unknown -p polaris-types (#104)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: build (wasm32-unknown-unknown)
        run: cargo build --target wasm32-unknown-unknown -p polaris-types
        env:
          SQLX_OFFLINE: "true"
      - name: clippy (wasm32-unknown-unknown)
        run: cargo clippy --target wasm32-unknown-unknown -p polaris-types --lib -- -D warnings
        env:
          SQLX_OFFLINE: "true"

  boundary:
    # AC-7: polaris-frontend must not import polaris_backend internals or
    # call mutating /api/* routes via raw string literals; every non-public
    # read and every mutation flows through PolarisApiClient. The xtask
    # scanner enforces the rule mechanically — see
    # `xtask/src/check_frontend_boundary.rs` for the pattern list and
    # `.design/polaris-proto-blue-integration.md` §D for the contract.
    name: cargo xtask check-frontend-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-frontend-boundary
        env:
          SQLX_OFFLINE: "true"
