# Publish polaris-backend container image to GitHub Container Registry (issue #209).
#
# Triggers (intentionally narrow — never PRs):
#   - push to main: produces `:main-<short-sha>` + `:latest`
#   - push of v* tag: produces `:vX.Y.Z` (e.g. v0.6.0 → :v0.6.0)
#
# The PR exclusion is deliberate: contributor forks must not be able
# to write to the org's container registry. The publish workflow runs
# only on the upstream `main` branch and tag refs, which can only be
# created by a maintainer with push access. The separate `ci.yml`
# workflow already covers PR build / clippy / test validation.
#
# Image
#   ghcr.io/dollspace-gay/polaris-backend  (multi-arch manifest: linux/amd64, linux/arm64)
#
# Why multi-arch
#   The labeler profile is the broadly-deployable single-host image.
#   Operators run it on amd64 cloud VMs, on arm64 cloud VMs (AWS
#   Graviton, GCP T2A, Hetzner ARM), and on Raspberry Pi-class home
#   servers. Building a single multi-arch manifest means
#   `docker compose pull` picks the right binary automatically.

name: publish-image

on:
  push:
    branches: [main]
    tags: ["v*"]

# We deliberately do NOT enable `pull_request` here; see header comment.

permissions:
  contents: read
  packages: write   # GHCR push requires this scope on GITHUB_TOKEN.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dollspace-gay/polaris-backend

concurrency:
  # Serialise per-ref so two rapid pushes to main don't race the
  # registry's tag-mutation path.
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build & push (multi-arch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The labeler-profile Dockerfile builds the polaris-backend Rust
      # binary inside the image but explicitly does NOT compile the
      # frontend wasm bundle (see deploy/Dockerfile.labeler-profile L47-L49).
      # We build it here, in the workflow, so the wasm artefact is part
      # of the build context. The Dockerfile change that COPYs the dist/
      # tree into the runtime image is tracked separately; running the
      # build now keeps the workflow ready for that integration.
      - name: Install Rust toolchain (wasm32 target)
        uses: dtolnay/rust-toolchain@1.88
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        run: |
          set -euo pipefail
          # Pin to the release Polaris was developed against; bump when
          # polaris-frontend bumps. trunk has a single static binary so
          # the install is just `cargo install --locked`.
          cargo install --locked --version 0.21.4 trunk

      - name: Build frontend (trunk build --release)
        working-directory: polaris-frontend
        env:
          SQLX_OFFLINE: "true"
        run: trunk build --release

      - name: Set up QEMU (for arm64 emulation on amd64 runners)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute image tags. The metadata-action handles the
      # branch-vs-tag distinction automatically:
      #   - push to main: emits `latest` + `main-<sha>`
      #   - push of v1.2.3: emits `v1.2.3` + `1.2` + `1` (semver)
      # See https://github.com/docker/metadata-action#tags-input
      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=polaris-backend
            org.opencontainers.image.description=Polaris labeler-profile backend (ATProto labeler / moderation service).
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # Build from the repo root so the COPY paths in
          # deploy/Dockerfile.labeler-profile resolve correctly.
          context: .
          file: deploy/Dockerfile.labeler-profile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend — successive builds reuse
          # cargo deps + builder layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
