[package]
name = "polaris-publish-labeler-record"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI to publish app.bsky.labeler.service record to operator's Bluesky account (REQ-2 / AC-2 of .design/polaris-proto-blue-integration.md)."

[lib]
name = "polaris_publish_labeler_record"
path = "src/lib.rs"

[[bin]]
name = "polaris-publish-labeler-record"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
proto-blue.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
secrecy = { workspace = true, features = ["serde"] }

# URL parsing for the `--service-url` flag. Workspace-pinned (#59).
url.workspace = true

# Issue #61: shared OAuth client-metadata loader. Both this CLI's `--oauth`
# flow and `polaris-backend`'s ATProto OAuth verifier (#31) import
# `polaris_types::oauth_config::load_client_metadata` so there is one
# canonical read-and-parse path for the operator-supplied JSON.
polaris-types = { path = "../polaris-types" }

[lints]
workspace = true
