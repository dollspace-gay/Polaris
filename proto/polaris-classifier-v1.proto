// Polaris classifier integration — wire schema v1.
//
// Issue #45 / M5 PR 1: ML classifier integration via gRPC as a
// pattern-engine signal source. The classifier service is operated
// independently (either by the Polaris operator self-hosting or by an
// external provider via cloud-API); Polaris is a CLIENT of this
// service.
//
// Privacy notes:
//   - The default `send_feedback = false` config (#130 / PR 6) means
//     no moderator-action data is sent back to the classifier service
//     beyond what the classifier already saw at inference time.
//   - For external classifiers (cloud-API): operators opt in
//     per-classifier; a UI banner surfaces "this case was scored by
//     external classifier X" so moderators have explicit knowledge of
//     the data flow.
//
// Versioning:
//   - This file is `v1`. Backward-incompatible changes require a new
//     proto package (`polaris.classifier.v2.Classifier`). Forward-
//     compatible additions follow proto3 conventions (additive fields
//     with new numbers; never reuse field numbers; never repurpose
//     semantics).

syntax = "proto3";

package polaris.classifier.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Classifier service — Polaris consumes this; the service provider
// implements it. The contract is intentionally minimal so that
// fine-tuned BERT classifiers, fine-tuned LLMs, and rule engines can
// all conform to the same wire shape with their own internal model
// choices (issue #45 Q1, resolved in #124: model-agnostic).
service Classifier {
  // Single-shot synchronous classification. The v2 baseline call
  // path for the firehose ingest worker.
  //
  // Polaris emits one Classify call per (event, classifier-config)
  // pair. The caller's per-call timeout is operator-configurable
  // (default 500ms, fitting fine-tuned-BERT inference latency).
  rpc Classify(ClassifyRequest) returns (ClassifyResponse);

  // Bidirectional streaming for high-throughput Bluesky-profile
  // deployments where per-RPC overhead of Classify is noticeable.
  // Optional path; v2 baseline does not require classifier services
  // to implement this.
  rpc ClassifyStream(stream ClassifyRequest) returns (stream ClassifyResponse);

  // Opt-in feedback callback (issue #130 / PR 6). Sent by Polaris
  // ONLY when `[[classifiers.<name>]] send_feedback = true` is
  // explicitly set by the operator. Payload is the bare minimum:
  // event_id, classifier_label, classifier_confidence,
  // moderator_action_kind. Never carries moderator identity, reasoning
  // text, reporter identity, or subject content.
  rpc Feedback(FeedbackRequest) returns (FeedbackResponse);

  // Health probe wired into the per-classifier circuit breaker
  // (#128 / PR 4). Returns rapidly so the breaker's half-open probe
  // distinguishes "service is up" from "service is slow."
  rpc HealthCheck(google.protobuf.Empty) returns (HealthResponse);

  // Issue #231 / .design/llm-moderation-assist.md REQ-A1.
  //
  // Recommend takes a hydrated case bundle and returns a structured
  // moderation judgment. Designed for LLM adapters that read the
  // operator's policy clauses + case context and produce an action
  // recommendation with confidence + reasoning. Unlike Classify (which
  // emits Label signals scored against a model-specific vocabulary),
  // Recommend emits a structured action suggestion that the dispatcher
  // routes through the manual / assisted / autonomous mode machinery
  // defined in the design doc.
  //
  // Same service, same per-classifier semaphore + circuit breaker, same
  // health probe (REQ-A4). Default timeout is 15 s vs. Classify's 500 ms
  // — LLM inference is slow (REQ-A5). Per-classifier overridable; a
  // timeout increments the breaker counter just like Classify does.
  rpc Recommend(RecommendRequest) returns (RecommendResponse);
}

// A single classification request.
message ClassifyRequest {
  // Stable, operator-allocated identifier for this event.
  //
  // Used by Polaris to correlate the classifier's response with the
  // originating firehose event (and to dedup if the request is
  // retried). Opaque to the classifier service.
  string event_id = 1;

  // ATProto DID of the subject (account, post, etc.) being scored.
  //
  // The classifier service may or may not inspect this; it's
  // provided so external classifiers that maintain per-subject
  // historical state can correlate scores.
  string subject_did = 2;

  // Text content of the event, if any.
  //
  // Empty for media-only events. Encoded as UTF-8 bytes.
  optional bytes text_content = 3;

  // Content-addressed reference to an image blob, if any.
  //
  // Format: ATProto blob CID (e.g. `bafkrei...`). The classifier
  // service fetches the blob through the operator's PDS or CDN; the
  // bytes themselves are NOT included in this request (keeping the
  // RPC small for the common case).
  optional string image_blob_cid = 4;

  // Hint to the classifier service about which model variant to use.
  //
  // Opaque; the classifier service interprets. Useful when a single
  // service provider hosts multiple models behind one gRPC endpoint.
  optional string model_hint = 5;
}

// A single classification response.
message ClassifyResponse {
  // Identifier of the model that produced this response.
  //
  // Polaris stores this in `classifier_signals.classifier_name` for
  // audit + accuracy-tracking (#127 / PR 3, #128 / PR 4).
  string model = 1;

  // Version of the model that produced this response.
  //
  // Stored alongside `model` for reproducibility. Format is service-
  // defined (semver, git SHA, training-run timestamp, etc.).
  string model_version = 2;

  // Set of labels the classifier emitted, with per-label confidence.
  //
  // The vocabulary is model-specific (issue #45 Q1: model-agnostic).
  // Polaris stores each label as a separate Observation row so
  // disagreement and per-label accuracy tracking work without
  // collapsing labels prematurely.
  repeated Label labels = 3;

  // When the classifier produced this response.
  //
  // Useful for tracking classifier latency drift over time.
  google.protobuf.Timestamp produced_at = 4;
}

// One labeled output from a classifier.
message Label {
  // The classifier-emitted label string. Vocabulary is
  // model-specific.
  string value = 1;

  // Classifier confidence in this label, in `[0.0, 1.0]`.
  //
  // Polaris's storage representation is `DOUBLE PRECISION` in
  // `classifier_signals.confidence`; proto3 `float` is sufficient
  // for the wire (BERT softmax outputs are typically only ~6
  // significant figures).
  float confidence = 2;
}

// Feedback from Polaris to the classifier service. Opt-in.
//
// LLM-10 (#239 / REQ-G1..G4) extends the envelope with two
// outcome-tracking fields the LLM moderation-assist substrate uses
// to close its learning loop:
//
//   * `was_recommendation_taken` — `true` on positive confirmation
//     (assisted-mode draft approved, or autonomous action's
//     `reversible_until` window elapsed unreversed), `false` on
//     reversal of an autonomous action or rejection of an
//     assisted-mode draft.
//
//   * `reversal_reasoning` — the moderator's stated *reason* for
//     reversing an autonomous action or rejecting an assisted draft.
//     Free text. The privacy floor (REQ-G4) is the same as for the
//     legacy four fields: NO moderator identity (no handle, no DID,
//     no moderator_id) is carried in this envelope. The reasoning
//     is the moderator's *content* for the LLM to learn from, not
//     their identity.
message FeedbackRequest {
  // The originating event_id from the corresponding ClassifyRequest.
  string event_id = 1;

  // The label the classifier emitted (one of the values from the
  // corresponding ClassifyResponse.labels).
  string classifier_label = 2;

  // The classifier's stated confidence in `classifier_label`.
  float classifier_confidence = 3;

  // The moderator's final action_kind for the event.
  //
  // Discrete vocabulary: `label`, `takedown`, `mute`, `warn`,
  // `escalate`, `no_action`. Matches the v1 Polaris ActionKind enum.
  // The classifier service may use this to track accuracy ("model
  // said spam 0.95, moderator agreed and took down" vs "model said
  // spam 0.95, moderator decided no_action") but Polaris does not
  // dictate how.
  string moderator_action_kind = 4;

  // LLM-10 (#239, REQ-G1..G3): did the moderator accept the
  // recommendation?
  //
  // Semantics:
  //   * Reversal of an autonomous action ⇒ `false` (REQ-G1).
  //   * Rejection of an assisted-mode draft ⇒ `false` (REQ-G2).
  //   * `reversible_until` window elapses unreversed ⇒ `true`
  //     (REQ-G3 — the LLM's autonomous action stood, positive
  //     signal).
  //   * Approval of an assisted-mode draft ⇒ `true` (REQ-G2).
  //
  // For the legacy classifier-feedback path (issue #130 / PR 6) this
  // field defaults to `false` because the legacy path emits feedback
  // on any moderator action regardless of agreement; the existing
  // `moderator_action_kind` field already carries the alignment
  // signal in that case.
  //
  // Backward-compat: this is field 5; classifier services that
  // pre-date LLM-10 simply receive proto3's default (`false`) and
  // ignore the field.
  bool was_recommendation_taken = 5;

  // LLM-10 (#239, REQ-G1): when a moderator reverses an autonomous
  // action (or rejects an assisted-mode draft), the moderator's
  // stated *reason* in free text.
  //
  // Privacy floor (REQ-G4): the reasoning is *content* the LLM can
  // learn from. It is NOT the moderator's identity. The build path
  // in `polaris-backend/src/classifier/feedback.rs::build_feedback`
  // takes a `&str` parameter — there is no path for a
  // `moderator_id` or `moderator_handle` to be threaded in. A test
  // in `polaris-backend/tests/llm_feedback_privacy.rs` asserts the
  // payload's encoded form never contains a DID / handle prefix.
  //
  // Empty string for the positive-confirmation path (REQ-G3): the
  // action stood without intervention, there is no reasoning to
  // carry.
  string reversal_reasoning = 6;
}

// Feedback acknowledgement.
message FeedbackResponse {
  // Empty by convention; the classifier service may add fields in
  // future schema revisions (semver-additive).
}

// Classifier service health.
message HealthResponse {
  // Service-defined health string. Polaris treats any non-empty,
  // non-"failed" value as healthy for the purposes of the circuit
  // breaker probe.
  string status = 1;

  // Optional service-specific diagnostics. Surfaced in
  // `polaris federation-status`-equivalent classifier tooling
  // (out of scope for v2 — operator inspects logs directly).
  optional string message = 2;
}

// Issue #231 / .design/llm-moderation-assist.md REQ-A2.
//
// Hydrated case bundle the Recommend RPC sends to an LLM adapter. The
// adapter reads the operator's policy clauses + the case context +
// prior actions (the precedent corpus) and produces a structured
// moderation judgment back via RecommendResponse.
//
// Privacy note: this message intentionally carries case content
// (reports, observation evidence, prior action reasoning, policy
// clauses, post text or account profile) but NEVER carries moderator
// identities. PriorAction omits `moderator_id` by design; only the
// outcome + cited policies + reasoning travel. Same floor as the
// Feedback envelope enforces today (see file header privacy notes).
message RecommendRequest {
  // UUID v7 generated by Polaris. The adapter echoes this back in
  // RecommendResponse.event_id for trace correlation. Opaque to the
  // adapter.
  string event_id = 1;

  // ATProto DID of the subject (account or post) being judged.
  string subject_did = 2;

  // `"account"` or `"post"`. Determines which policy clauses are
  // relevant + which `subject_scope` values are valid on the response.
  string subject_kind = 3;

  // The incident this subject sits inside. Lets the adapter correlate
  // multiple recommendations on related subjects if it wants to; opaque
  // to Polaris correlation logic.
  string incident_id = 4;

  // Reports that triggered the case (category, body, reporter DID).
  // Repeated because a single case may aggregate multiple reports on
  // the same subject before reaching a moderator.
  repeated Report reports = 5;

  // All Observation rows on this subject including classifier signals,
  // pattern detector output, and upstream labels. The adapter uses
  // these as supporting evidence — they're the deterministic signals
  // the LLM grounds against alongside the policy clauses.
  //
  // Naming-collision check (per #231 plan): the existing
  // `polaris.classifier.v1` package has no prior `Observation` message,
  // so this name is used verbatim. The wire `Observation` here is
  // distinct from Polaris's internal `polaris-types::Observation` enum
  // (which is a Rust-side discriminated union); the wire form is a
  // flat struct that carries the kind + JSON-encoded evidence.
  repeated Observation observations = 6;

  // Chronological prior actions on this subject with their cited
  // policies + reasoning. This is the precedent corpus the LLM grounds
  // against so consecutive cases get consistent treatment.
  //
  // Privacy floor: moderator_id is NOT in PriorAction. The LLM sees
  // outcomes, never the moderator who decided them.
  repeated PriorAction prior_actions = 7;

  // Every current-version `mod_policies` row whose `scope` covers this
  // subject's kind. Includes `decision_criteria`, `examples_positive`,
  // `examples_negative`, and the `linked_label_value` (REQ-A2). The
  // adapter cites these by `identifier` in the response.
  repeated PolicyClause policies = 8;

  // When subject_kind == "post": the post text, embeds (image alt-
  // text), reply parents one level deep. When subject_kind ==
  // "account": handle, display name, bio, post history sample. Format
  // is adapter-defined — Polaris just passes through what
  // `case_context.rs` (REQ-C3) hydrated.
  string subject_context = 9;

  // Operator-configurable hint; the adapter may truncate its
  // generation to this many tokens. Zero means "no hint, adapter
  // default". (REQ-A2.)
  int32 max_response_tokens = 10;
}

// Naming-collision check (per #231 plan): the existing
// `polaris.classifier.v1` package has no prior `Report` message, so
// this name is used verbatim. If a future v1 addition needs a different
// `Report` shape, this one stays (proto3 forward-compat: never reuse
// type names with different semantics).
message Report {
  // Operator-defined report category (`spam`, `harassment`, `csam`,
  // ...). Opaque to the adapter; the policies the adapter reads
  // dictate how categories map to decisions.
  string category = 1;

  // Free-form reporter body. May be empty.
  string body = 2;

  // ATProto DID of the reporter. Surfaced so the adapter can detect
  // brigading patterns (multiple reports from related accounts); the
  // adapter is not expected to attribute decisions to specific
  // reporters.
  string reporter_did = 3;
}

// A single Observation row on the subject — classifier signal, pattern
// detector output, upstream label, or earlier LLM recommendation.
// Polaris's internal `ObservationKind` enum (in `polaris-types`) is
// the source of truth for the `kind` vocabulary; on the wire we keep
// it as a string so this proto stays stable across `ObservationKind`
// variant additions.
message Observation {
  // E.g. `image_hash_cluster`, `account_cohort`, `reply_brigade`,
  // `report_volume_anomaly`, `external_label`, `classifier_signal`,
  // `llm_recommendation`. Vocabulary mirrors `ObservationKind` in
  // `polaris-types/src/observation.rs`.
  string kind = 1;

  // Detector / classifier confidence in `[0.0, 1.0]`. `float` matches
  // ClassifyResponse.Label.confidence (the storage representation is
  // DOUBLE in Postgres but BERT softmax outputs are only ~6
  // significant figures, same as Label).
  float confidence = 2;

  // Kind-specific evidence, JSON-encoded. The adapter parses this
  // per-`kind`; Polaris does not interpret it on the wire. Keeping it
  // as a JSON blob avoids a proto migration every time a new
  // observation kind ships.
  string evidence_json = 3;

  // RFC3339 timestamp of when the detector emitted this observation.
  // String form (not google.protobuf.Timestamp) to keep adapter
  // parsing trivial across language ecosystems — RFC3339 is universal.
  string detected_at = 4;
}

// One prior action on the subject. The precedent corpus: the LLM
// grounds its current recommendation against what the operator's
// moderators (or earlier autonomous-agent runs) have done before.
//
// Privacy floor (REQ-A2 / design doc §Privacy boundary):
// `moderator_id` is intentionally absent — the LLM sees outcomes,
// never the moderator who decided them. The `Feedback` envelope
// enforces the same floor on the reverse direction.
message PriorAction {
  // The action verb: `label`, `takedown`, `warn`, `mute`, `escalate`,
  // `no_action`, `reverse`. Same vocabulary as the v1 ActionKind enum.
  string kind = 1;

  // The label value when `kind == "label"`; empty string otherwise.
  // Operator-declared label values (e.g. `spam`, `nsfw`, ...).
  string label_value = 2;

  // The free-form reasoning the moderator (or the autonomous agent)
  // recorded for this action. Markdown.
  string reasoning = 3;

  // Identifiers of the `mod_policies` rows cited by this action at
  // its creation time. The LLM uses these to weight precedent — an
  // action citing the same policy the current case is about is more
  // relevant than one citing an unrelated policy.
  repeated string cited_policy_identifiers = 4;

  // RFC3339 timestamp of when the action was created. Chronological
  // order matters for precedent (newer decisions can supersede older
  // ones; the LLM is expected to notice that).
  string created_at = 5;

  // Field number 6 reserved for a future `actor_kind` field
  // (`"human"` vs `"autonomous_agent"`) — currently unnecessary
  // because the wire format already conveys this via the
  // recommendation's audit envelope, but reserving the slot lets us
  // surface it on PriorAction without a renumber if we change our
  // mind.
  reserved 6;
}

// One current-version policy clause from `mod_policies`. The adapter
// reads these as the operator's expressed moderation intent; the
// recommendation cites at least one by `identifier`.
message PolicyClause {
  // Stable, operator-allocated identifier (e.g. `spam.v1`,
  // `harassment.targeted`). Cited verbatim in
  // `RecommendedAction.cited_policy_identifiers`; the dispatcher
  // validates the citations against the request set (REQ-A3).
  string identifier = 1;

  // Monotonically incrementing version. Snapshotted into the action
  // audit envelope at create time so a future audit can see exactly
  // which clause the agent read (REQ-F1).
  int32 version = 2;

  // Human-readable name. Surfaced to the moderator alongside the
  // recommendation in the case view.
  string name = 3;

  // Long-form description. Markdown. The adapter reads this as the
  // primary policy text.
  string description = 4;

  // `"account"`, `"post"`, or `"both"`. Limits which subject kinds
  // this clause applies to.
  string scope = 5;

  // Operator-defined severity tag (`low`, `medium`, `high`,
  // `critical`). Opaque to Polaris; the adapter may use it to
  // calibrate confidence.
  string severity = 6;

  // Concrete decision criteria — the "how do I tell if this applies?"
  // text the operator wrote for moderators. Markdown.
  string decision_criteria = 7;

  // Positive examples ("clauses like this should match") with
  // expected actions.
  repeated PolicyExample examples_positive = 8;

  // Negative examples ("clauses like this should NOT match") with
  // notes on why not.
  repeated PolicyExample examples_negative = 9;

  // Action kinds the operator considers eligible to apply when this
  // policy is cited (e.g. `["label", "warn"]`). The dispatcher cross-
  // references this against `autonomous_action_kinds` for the
  // autonomous floor (REQ-S2).
  repeated string suggested_action_kinds = 10;

  // When `suggested_action_kinds` includes `"label"`, the label value
  // to apply. Operator-declared; must match the operator's
  // `label_values` set.
  string linked_label_value = 11;
}

// A single example illustrating a policy clause. Positive examples
// describe "this should match"; negative describe "this should not".
message PolicyExample {
  // The excerpt the example is drawn from. Free-form text; for an
  // account-scope policy this could be a bio fragment, for a post-
  // scope policy it could be the post text.
  string excerpt = 1;

  // Surrounding context the operator captured (e.g. "in reply to a
  // bot account", "during a coordinated brigading window").
  string context = 2;

  // For positive examples: the expected `action_kind` (e.g.
  // `"label"`, `"takedown"`). For negative examples: a `why_not`
  // explanation. The adapter is responsible for distinguishing
  // which interpretation applies based on the containing list
  // (`examples_positive` vs. `examples_negative`).
  string note = 3;
}

// Issue #231 / .design/llm-moderation-assist.md REQ-A3.
//
// Structured judgment back from the LLM adapter. Persisted verbatim
// into an `LlmRecommendation` observation (REQ-B1) and used by the
// dispatcher to decide manual / assisted / autonomous routing.
message RecommendResponse {
  // Echoed verbatim from `RecommendRequest.event_id`. Polaris uses
  // this to correlate the response with the originating case; a
  // mismatch is a protocol error.
  string event_id = 1;

  // What produced this recommendation (e.g. `"claude-sonnet-4-6"`,
  // `"qwen-2.5-7b-instruct"`). Snapshotted into the action audit
  // envelope as `actions.model` (REQ-F1).
  string model = 2;

  // Adapter-defined version string (semver, git SHA, training-run
  // timestamp, ...). Stored alongside `model` for reproducibility.
  string model_version = 3;

  // Opaque-to-Polaris identifier the adapter uses to identify which
  // prompt template it ran. The adapter owns stable versioning.
  // Audited via `actions.prompt_template_id` (REQ-F1).
  string prompt_template_id = 4;

  // The structured action recommendations. Usually one; multiple
  // allowed when the LLM thinks several independent actions apply
  // (e.g. "label the post AND warn the account").
  repeated RecommendedAction recommended_actions = 5;

  // Optional synthesis paragraph framing multiple recommended
  // actions. Markdown. May be empty when there's only one
  // recommended action.
  string overall_reasoning = 6;

  // Observability: input token count for this call (REQ-A3).
  // Surfaced in metrics + admin audit page.
  int32 input_tokens = 7;

  // Observability: output token count for this call (REQ-A3).
  // Surfaced in metrics + admin audit page.
  int32 output_tokens = 8;
}

// One recommended action within a RecommendResponse. The dispatcher
// runs each through the safety floors (REQ-S1 through REQ-S8)
// independently — a multi-action recommendation can mix autonomous-
// eligible and assisted-only actions.
message RecommendedAction {
  // `label`, `warn`, `takedown`, `escalate`, or `no_action`. The
  // dispatcher rejects anything else; the action-kind gate (REQ-S2)
  // further restricts autonomous-eligibility to `{label, warn,
  // takedown}`.
  string action_kind = 1;

  // Required when `action_kind == "label"`; must match the
  // operator's declared `label_values` set. Empty otherwise.
  string label_value = 2;

  // `"account"` or `"post"`. Required to be `"post"` if
  // `action_kind == "takedown"` for autonomous eligibility (REQ-S3 /
  // workbook REQ-G2 — account-level takedowns are always human-
  // required).
  string subject_scope = 3;

  // Confidence in `[0.0, 1.0]`. Below the policy's
  // `autonomous_confidence_threshold` downgrades to assisted; below
  // `assisted_confidence_threshold` downgrades to manual (REQ-S1).
  // `float` matches the existing Label.confidence representation.
  float confidence = 4;

  // At least one entry; every identifier must be present in the
  // request's `policies` array. The dispatcher validates citations
  // against the request set (REQ-A3) — uncited or hallucinated
  // policy identifiers cause the recommendation to be rejected.
  repeated string cited_policy_identifiers = 5;

  // The LLM's stated reasoning for this action. Markdown. ≥10 chars
  // (matches the `actions.reasoning` CHECK constraint in Postgres).
  string reasoning = 6;

  // Non-blocking notes the LLM wants the moderator to see (e.g.
  // "I'm uncertain whether this is satire; consider checking the
  // account's pinned post"). Surfaced in the case-view sidebar
  // (REQ-J1); never blocks action emission.
  repeated string caveats = 7;
}
