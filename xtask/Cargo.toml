[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Polaris workspace automation tasks (invoked via `cargo xtask <subcommand>`)."

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
clap.workspace = true
walkdir.workspace = true
regex.workspace = true
anyhow.workspace = true
# `wasmparser` for `check-wasm-symbols` (issue #34). Reads the released
# wasm artifact and walks the custom-name section + export/import lists
# to verify the lexicon validation engine survived dead-code elimination.
wasmparser.workspace = true

# `audit-verify` (issue #35; design.md §6 + §9): walk the audit-log
# chain end-to-end against the DB identified by `DATABASE_URL`. The
# xtask reuses the verification primitive from `polaris-backend::audit`
# rather than reimplementing the chain walk so the operator-facing
# diagnostic and the in-process verifier never drift.
polaris-backend = { path = "../polaris-backend" }
sqlx.workspace = true
tokio.workspace = true

# `lexicon-contract` (REQ-E2 / AC-E2 of
# `.design/polaris-operationally-complete.md`): fetch Bluesky's published
# lexicon JSONs at a pinned upstream commit and re-run Polaris's
# wire-shape validators against the fresh schemas so upstream drift
# files an issue instead of biting an operator at runtime.
#
# - `proto-blue` for `proto_blue::lexicon::{LexiconDoc, LexUserType,
#   Lexicons}` and the underlying `validate_record` primitive. Re-uses
#   the workspace pin so xtask and the production validator never diverge.
# - `polaris-publish-labeler-record` for `build_labeler_service_record`
#   + `validate_record` — drift-detection re-runs the same validator the
#   production publish CLI uses, rather than forking a parallel checker.
# - `reqwest` for the GitHub raw-content fetches (blocking client to
#   keep the xtask sync entrypoint simple; no tokio runtime needed for
#   this subcommand).
# - `serde_json` for the cache files on disk and the LexiconDoc decode.
proto-blue.workspace = true
polaris-publish-labeler-record = { path = "../polaris-publish-labeler-record" }
reqwest = { workspace = true, features = ["blocking"] }
serde_json.workspace = true

[dev-dependencies]
# `tempfile` for the check-wasm-budget unit tests (#71) — writes a temp
# file and asserts the size-budget gate against it. Already in the workspace
# lockfile transitively via testcontainers / sqlx.
tempfile = "3"

[lints]
workspace = true
